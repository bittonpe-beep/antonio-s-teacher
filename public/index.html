<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>
Teacher Dashboard
</title>

<style>

body{
    font-family:Arial;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    border:1px solid gray;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
}

textarea,input{
    width:100%;
}

button{
    padding:10px;
}

</style>

</head>

<body>

<h1>
👩‍🏫 Teacher Dashboard
</h1>

<div class="card">

<h2>
📣 Message
</h2>

<textarea
id="message"
rows="4"
></textarea>

<button
onclick="saveAll()"
>
Save
</button>

</div>

<div class="card">

<h2>
🚨 Banner
</h2>

<input
id="banner"
>

</div>

<div class="card">

<h2>
🎨 Specials
</h2>

<input id="m0">
<input id="m1">
<input id="m2">
<input id="m3">
<input id="m4">

</div>

<div class="card">

<h2>
📅 Events
</h2>

<input
id="eventTitle"
placeholder="Title"
>

<input
id="eventDate"
type="date"
>

<button
onclick="addEvent()"
>
Add Event
</button>

<div
id="events"
></div>

</div>

<script src="ipt>

</body>

</html>
